<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  容器页（包裹方）。部署在「与目标站点不同的 origin」上。

  三条必须遵守的约定，缺一不可：

  1) Referrer-Policy 必须放宽为 unsafe-url。
     目标站点的第 2 层白名单靠 Referer 的「完整路径」判定，而浏览器默认
     strict-origin-when-cross-origin 只发 origin、把路径剥掉，会导致合法容器也被拒。
     下面的 <meta name="referrer"> 与「服务端响应头」二选一即可，响应头优先级更高。

  2) 必须把本页 URL 加进目标站点的 ALLOWED_CONTAINERS。
     带路径写法（精确到本页，推荐）：https://本页域名/container.html

  3) 容器页与目标站点需为「不同 origin」。同 origin 直接能嵌，不需要这套机制。

  本页同时演示：地址栏同步、弹窗白名单下发、以及 bridge 上报事件的可视化。
-->
<meta name="referrer" content="unsafe-url">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>容器页 · 包裹示例</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7fb; color: #1f2430; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 18px; background: #1f2430; color: #fff; }
  header strong { margin-right: 4px; }
  header label { font-size: 13px; color: #cbd5e1; }
  header input { flex: 1 1 260px; min-width: 180px; padding: 7px 10px; border: 1px solid #3b4457; border-radius: 8px; background: #2b3446; color: #fff; font-size: 13px; }
  header button { padding: 8px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 13px; }
  header button:hover { background: #1d4ed8; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .frame-box { flex: 1 1 auto; min-width: 0; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(15,23,42,.08); overflow: hidden; }
  .frame-box iframe { display: block; width: 100%; height: 78vh; border: 0; background: #fff; }
  aside { flex: 0 0 320px; padding: 14px 16px; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  aside h2 { margin: 0 0 10px; font-size: 15px; }
  aside h2:not(:first-child) { margin-top: 18px; }
  #log { margin: 0; padding: 0; list-style: none; max-height: 240px; overflow: auto; font-size: 12px; line-height: 1.7; }
  #log li { padding: 4px 6px; border-radius: 6px; }
  #log li:nth-child(odd) { background: #f1f5f9; }
  #log .kind { font-weight: 600; }
  #log .kind.popup-allowed { color: #15803d; }
  #log .kind.popup-blocked, #log .kind.top-navigation-blocked { color: #b91c1c; }
  .hint { margin: 0; font-size: 12px; line-height: 1.8; color: #64748b; }
  .hint code { padding: 1px 5px; border-radius: 4px; background: #eef2ff; color: #1f2430; }
  @media (max-width: 900px) { .wrap { flex-direction: column; } aside { flex: 1 1 auto; width: 100%; } }
</style>
</head>
<body>

<header>
  <strong>容器页</strong>
  <label for="target">被包裹地址</label>
  <input id="target" value="http://127.0.0.1:8001/login">
  <button id="load">加载</button>
</header>

<div class="wrap">
  <div class="frame-box">
    <iframe id="frame" src="http://127.0.0.1:8001/login" allow="clipboard-write"></iframe>
  </div>

  <aside>
    <h2>地址同步</h2>
    <p class="hint" id="current">等待 bridge 上报…</p>

    <h2>事件日志</h2>
    <ul id="log"></ul>

    <h2>使用说明</h2>
    <p class="hint">
      目标站点需配置 <code>ALLOWED_CONTAINERS</code>，把本页完整地址列入：<br>
      <code>ALLOWED_CONTAINERS=http://本页域名/container.html</code><br><br>
      本页已设 <code>Referrer-Policy: unsafe-url</code>，跨源才会带上完整路径。
    </p>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // 被包裹的目标站点 origin。跨源时容器读不到 iframe 内部 location，
  // 因此下面所有地址同步都依赖目标站点主动 postMessage 上报。
  var TARGET_ORIGIN = 'http://127.0.0.1:8001';
  var CHANNEL = 'frame-bridge';

  // 允许目标站点真实弹出的地址白名单（支持单个 * 通配）。
  // 未命中时，目标站点的 frame-bridge.js 会把 window.open / target="_blank"
  // 收敛为「在本框内导航」，从而不会跳出容器。
  var ALLOW_POPUPS = [
    TARGET_ORIGIN + '/site/oauth/*'
  ];

  var frame = document.getElementById('frame');
  var logEl = document.getElementById('log');
  var currentEl = document.getElementById('current');

  function log(kind, url) {
    var li = document.createElement('li');
    var k = document.createElement('span');
    k.className = 'kind ' + kind;
    k.textContent = kind;
    li.appendChild(k);
    if (url) {
      li.appendChild(document.createTextNode(' · ' + url));
    }
    logEl.insertBefore(li, logEl.firstChild);
    while (logEl.childElementCount > 60) logEl.removeChild(logEl.lastChild);
  }

  // 下发弹窗白名单。frame-bridge.js 只接受「来自父窗口、origin 匹配」的 policy 消息，
  // 所以这里必须用 window.postMessage(msg, TARGET_ORIGIN) 定向发送。
  function pushPolicy() {
    frame.contentWindow.postMessage({
      channel: CHANNEL,
      type: 'policy',
      allowPopups: ALLOW_POPUPS
    }, TARGET_ORIGIN);
  }

  // 接收目标站点的上报事件（ready / navigated / popup-* / top-navigation-blocked）。
  window.addEventListener('message', function (event) {
    if (event.origin !== TARGET_ORIGIN) return;
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.channel !== CHANNEL || data.type !== 'event') return;

    if (data.kind === 'ready') {
      // ready 可能在 policy 之前到达，收到后立即补发一次白名单。
      pushPolicy();
    }
    if (data.url) currentEl.textContent = data.url;
    log(data.kind, data.url);
  });

  // iframe 首次加载完成后下发白名单。
  frame.addEventListener('load', pushPolicy);

  // 手动切换被包裹地址。
  document.getElementById('load').addEventListener('click', function () {
    var url = document.getElementById('target').value.trim();
    if (!url) return;
    logEl.innerHTML = '';
    currentEl.textContent = '等待 bridge 上报…';
    frame.src = url;
  });
})();
</script>

</body>
</html>
